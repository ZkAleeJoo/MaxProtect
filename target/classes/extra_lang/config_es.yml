# Toda esta sección está en español. Cada item de este archivo es configurable.
# Si encuentras algo que no se puede configurar, repórtalo en nuestro Discord: https://discord.gg/Vr46JHm2kd

general:
  language: "es"
  prefix: "&#27F554&lArgosProtect &8» "
  update-check: true
  bstats: true

protection:
  home-cooldown-seconds: 5
  rent:
    enabled: false
    period-hours: 168
    check-interval-minutes: 10
  default-actionbar:
    enter: "&aEntrando en la protección de &f%owner%&a."
    exit: "&cSaliendo de la protección de &f%owner%&c."
  preview:
    cinematic:
      enabled: false
      duration-seconds: 5
      cooldown-seconds: 5
      height-offset: 18.0
      border-material: "RED_STAINED_GLASS"
      use-fake-blocks: true
  visual-effects:
    place:
      enabled: true
      particle: "DUST"
      count: 24
      offset-x: 0.45
      offset-y: 0.55
      offset-z: 0.45
      speed: 0.02
      dust-size: 1.2
      color:
        red: 124
        green: 255
        blue: 107
    remove:
      enabled: true
      particle: "DUST"
      count: 28
      offset-x: 0.55
      offset-y: 0.65
      offset-z: 0.55
      speed: 0.03
      dust-size: 1.35
      color:
        red: 255
        green: 77
        blue: 77
    view:
      enabled: true
      particle: "DUST"
      count: 1
      duration-seconds: 5
      interval-ticks: 10
      cooldown-seconds: 10
      dust-size: 1.2
      color:
        red: 39
        green: 245
        blue: 97
  sounds:
    buy:
      enabled: true
      sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
      volume: 0.8
      pitch: 1.2
    place:
      enabled: true
      sound: "ENTITY_PLAYER_LEVELUP"
      volume: 0.8
      pitch: 1.0
    remove:
      enabled: true
      sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
      volume: 0.8
      pitch: 0.8
    error:
      enabled: true
      sound: "ENTITY_VILLAGER_NO"
      volume: 0.8
      pitch: 1.2
    flag-change:
      enabled: true
      sound: "UI_BUTTON_CLICK"
      volume: 0.8
      pitch: 1.4

limits:
  default:
    max-protections: 3
    max-radius: 25
    min-price: 0
    max-price: 100000
  # Puedes agregar todos los grupos que quieras. Se usara el grupo con permiso y mayor prioridad.
  groups:
    vip:
      permission: "argosprotect.limits.vip"
      priority: 10
      max-protections: 10
      max-radius: 50
      min-price: 0
      max-price: 250000
    mvp:
      permission: "argosprotect.limits.mvp"
      priority: 20
      max-protections: 20
      max-radius: 75
      min-price: 0
      max-price: 500000

