name: ArgosProtect
version: 1.0.0
main: org.zkaleejoo.ArgosProtect
api-version: '1.21'
folia-supported: true
authors: [ ZkAleeJoo ]
description: Modern protection plugin
depend: [WorldGuard]
softdepend: [Vault, ProtectionStones]

commands:
  argosprotect:
    description: Main ArgosProtect command
    aliases: [ap]
  protection:
    description: Protection stone command
    aliases: [p]

permissions:
  argosprotect.admin:
    description: Full access to ArgosProtect and administrative commands.
    default: op
    children:
      argosprotect.admin.debug: true
      argosprotect.admin.listplaced: true
      argosprotect.admin.repair: true
      argosprotect.admin.report: true
      argosprotect.admin.logs: true
      argosprotect.admin.migrate: true
      argosprotect.protection: true
      argosprotect.protection.give: true
      argosprotect.protection.buy: true
      argosprotect.protection.fly: true
      argosprotect.protection.remove.others: true
      argosprotect.flags: true
  argosprotect.admin.debug:
    description: Allows inspecting placed protection tracking and WorldGuard data.
    default: op
  argosprotect.admin.listplaced:
    description: Allows opening the admin placed protections menu.
    default: op
  argosprotect.admin.repair:
    description: Allows repairing and safely cleaning placed protection tracking.
    default: op
  argosprotect.admin.report:
    description: Allows viewing protection database reports.
    default: op
  argosprotect.admin.logs:
    description: Allows viewing recent event logs for any placed protection.
    default: op
  argosprotect.admin.migrate:
    description: Allows previewing and applying supported protection plugin migrations.
    default: op
  argosprotect.protection:
    description: Allows using player protection commands such as paying rent.
    default: true
  argosprotect.protection.give:
    description: Allows giving protection stones to players.
    default: op
  argosprotect.protection.buy:
    description: Allows buying protection stones.
    default: true
  argosprotect.protection.fly:
    description: Allows toggling flight inside accessible protections.
    default: op
  argosprotect.protection.remove.others:
    description: Allows removing protection stones owned by other players.
    default: op
  argosprotect.flags:
    description: Allows owners to modify protection flags from the settings menu.
    default: true
