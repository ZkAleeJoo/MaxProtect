name: MaxProtect
version: ${project.version}
main: org.zkaleejoo.MaxProtect
api-version: '1.21'
folia-supported: true
authors: [ ZkAleeJoo ]
description: Modern protection plugin
depend: [WorldGuard]
softdepend: [Vault, ProtectionStones]

commands:
  maxprotect:
    description: Main MaxProtect command
    aliases: [mp]
  protection:
    description: Protection stone command
    aliases: [p]

permissions:
  maxprotect.admin:
    description: Full access to MaxProtect and administrative commands.
    default: op
    children:
      maxprotect.admin.debug: true
      maxprotect.admin.listplaced: true
      maxprotect.admin.repair: true
      maxprotect.admin.report: true
      maxprotect.admin.logs: true
      maxprotect.admin.migrate: true
      maxprotect.protection: true
      maxprotect.protection.give: true
      maxprotect.protection.buy: true
      maxprotect.protection.fly: true
      maxprotect.protection.remove.others: true
      maxprotect.flags: true
  maxprotect.admin.debug:
    description: Allows inspecting placed protection tracking and WorldGuard data.
    default: op
  maxprotect.admin.listplaced:
    description: Allows opening the admin placed protections menu.
    default: op
  maxprotect.admin.repair:
    description: Allows repairing and safely cleaning placed protection tracking.
    default: op
  maxprotect.admin.report:
    description: Allows viewing protection database reports.
    default: op
  maxprotect.admin.logs:
    description: Allows viewing recent event logs for any placed protection.
    default: op
  maxprotect.admin.migrate:
    description: Allows previewing and applying supported protection plugin migrations.
    default: op
  maxprotect.protection:
    description: Allows using player protection commands such as paying rent.
    default: true
  maxprotect.protection.give:
    description: Allows giving protection stones to players.
    default: op
  maxprotect.protection.buy:
    description: Allows buying protection stones.
    default: true
  maxprotect.protection.fly:
    description: Allows toggling flight inside accessible protections.
    default: op
  maxprotect.protection.remove.others:
    description: Allows removing protection stones owned by other players.
    default: op
  maxprotect.flags:
    description: Allows owners to modify protection flags from the settings menu.
    default: true
